bio:
  - >
    I'm Vignesh, a **product designer** and **design lead** working across
    enterprise software, fintech, and AI products. Currently leading design for
    **Kotak Mahindra's FYN** wholesale banking app at **DNEG.**
  - >
    When I’m not wireframing workflows, I’m probably making music, lifting at
    the gym, or storytelling through cinematic videos.
