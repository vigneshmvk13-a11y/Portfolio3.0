overview:
  heading: Designing a product around an autonomous AI
  intro: >-
    Prime Compass began as an AI-powered testing platform. I worked closely with
    the founders, principal architect, and engineering team to translate complex
    AI and system behavior into a usable product.
  challengeLabel: The challenge
  challenge:
    - >-
      Make autonomous AI activity visible without exposing unnecessary
      complexity.
    - >-
      Help users understand what the AI discovered and how confident they should
      be.
    - Give users ways to correct mistakes and recover from failures.
    - Turn large amounts of discovered behavior into something actionable
  insightLabel: The key insight
  insight: The AI is the explorer. The human remains the decision-maker.
solution:
  - heading: Making autonomous AI observable
    body: >-
      Instead of hiding discovery behind a loading state, I designed the
      experience to show where the AI was, what it was finding, and when it
      needed help.
    media:
      image: ../../assets/case-studies/prime-compass/solution/0/media/image.png
      alt: >-
        Discovery setup: the application URL and environment, personas and
        documents, with AI suggestions beside the Start discovery button
  - heading: Turning behavioral change into a visual signal
    body: >-
      I designed the Drift Map to show the relationship between a baseline and
      discovered behavior, helping users see where change was happening before
      investigating the details.
    media:
      image: ../../assets/case-studies/prime-compass/solution/1/media/image.png
      alt: >-
        Discovery v5 overview compared against v11.4: module, feature and
        scenario counts, AI-generated insights, and the start of the Drift Orbit
system:
  heading: Building the language behind the product
  intro: >-
    As Prime Compass expanded across discovery, dashboards, graphs, comparison,
    and configuration, I established a scalable design system instead of
    designing each screen in isolation.
  image: ../../assets/case-studies/prime-compass/system/image.png
  alt: >-
    The Nova design system file in Figma: its primitive and component pages,
    open on Buttons with every size and state
  link: nova
  cards:
    - title: Brand primitives
      body: Color, typography, spacing, radius, elevation, and foundational tokens.
    - title: Semantic aliases
      body: >-
        Meaningful roles for surfaces, text, borders, feedback, status, and
        interaction.
    - title: Component tokens
      body: >-
        Reusable components and interaction states mapped to the semantic
        system.
