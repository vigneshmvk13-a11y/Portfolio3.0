outcome:
  heading: From AI capability to a usable product model
  intro: >-
    My contribution went beyond individual screens. I helped shape how users
    understood, supervised, and acted on an autonomous system.
  cards:
    - title: Observable AI
      body: Made AI activity and discoveries visible at the right level of detail.
    - title: Behavioral intelligence
      body: Turned discovered behavior and drift into understandable visual models.
    - title: Scalable foundation
      body: >-
        Established a design system that could support PrimeThoughts' broader
        product portfolio.
reflection:
  heading: AI products need observable behavior
  body: >-
    When software makes decisions autonomously, hiding the process doesn't
    necessarily make the experience simpler. Users need enough visibility to
    understand what the system is doing and whether they should trust the
    result.


    This project also reinforced that failure is part of the UX, and that
    complex data becomes useful when the interface gives people a clear mental
    model of the relationships underneath it.
