outcome:
  heading: From AI capability to a usable product model
  intro: >-
    My contribution went beyond individual screens. I helped shape how users
    understood, supervised, and acted on an autonomous system.
  cards:
    - title: Observable AI
      body: System findings presented through visual product states.
    - title: Traceable deviations
      body: A clearer path from identifying drift to investigating its source.
    - title: Scalable design system
      body: >-
        Established a design system that could support PrimeThoughts' broader
        product portfolio.
reflection:
  heading: AI needs to make its behavior observable
  body: >-
    Designing AI products requires more than presenting generated results. Users
    need enough visibility into system behavior to understand discrepancies,
    question findings, and decide what to investigate next.
