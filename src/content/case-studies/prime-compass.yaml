overview:
  heading: Making autonomous AI behavior understandable
  intro: >-
    PrimeCompass analyzes product behavior to uncover discrepancies between
    expected and actual system behavior. The challenge was turning complex
    AI-driven analysis into information teams could interpret and act on.
  challengeLabel: The challenge
  challenge:
    - Making system behavior observable and understandable.
    - Helping users investigate deviations from expected behavior.
    - Presenting complex analysis without overwhelming users.
  insightLabel: The key insight
  insight: >-
    AI-generated findings become more useful when users can see what changed,
    understand why it matters, and trace the behavior behind the result.
solution:
  - heading: Making autonomous behavior observable
    body: >-
      I designed interfaces that expose discovered behavior, highlight
      deviations, and give users a clearer way to investigate how the product
      behaves against an expected baseline.
    media:
      image: ../../assets/case-studies/prime-compass/solution/0/media/image.png
      alt: >-
        Discovery setup: the application URL and environment, personas and
        documents, with AI suggestions beside the Start discovery button
      mp4: /media/prime-compass/solution/0/media/mp4.mp4
  - heading: Turning behavioral change into a visual signal
    body: >-
      I designed the Drift Map to show the relationship between a baseline and
      discovered behavior, helping users see where change was happening before
      investigating the details.
    media:
      image: ../../assets/case-studies/prime-compass/solution/1/media/image.png
      alt: >-
        Discovery v5 overview compared against v11.4: module, feature and
        scenario counts, AI-generated insights, and the start of the Drift Orbit
      mp4: /media/prime-compass/solution/1/media/mp4.mp4
system:
  heading: Building a consistent language for the product
  intro: >-
    I established a reusable visual language for complex product states,
    aligning interface patterns and components to support consistency across the
    experience.
  image: ../../assets/case-studies/prime-compass/system/image.png
  alt: >-
    The Nova design system file in Figma: its primitive and component pages,
    open on Buttons with every size and state
  link: nova-design-system
  cards:
    - title: Brand primitives
      body: Color, typography, spacing, radius, elevation, and foundational tokens.
    - title: Semantic aliases
      body: >-
        Meaningful roles for surfaces, text, borders, feedback, status, and
        interaction.
    - title: Component tokens
      body: >-
        Reusable components and interaction states mapped to the semantic
        system.
