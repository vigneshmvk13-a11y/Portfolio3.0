overview:
  heading: A growing platform needed a shared visual language
  intro: >-
    As Prime Compass expanded across discovery, drift analysis, comparison, and
    configuration, inconsistent patterns made the product harder to maintain and
    extend.


    I built Nova, a token-driven design system that aligned brand expression
    with behavioral intelligence and created a consistent foundation for design
    and engineering.
  challengeLabel: The challenge
  challenge:
    - Reduce visual inconsistencies across product modules.
    - Create reusable foundations for new features and products.
    - >-
      Keep semantic meaning consistent across complex states and data
      visualizations.
    - Make design decisions easier to translate into implementation.
solution:
  - heading: Creating a three-tier token architecture
    body: >-
      I separated raw visual values from semantic roles and component-specific
      tokens, so teams could update the system at the right layer without
      rebuilding every interface.
    media:
      image: ../../assets/case-studies/nova/solution/0/media/image.png
      alt: >-
        Figma variables panel for Nova: primitive, semantic and component
        collections, open on the grey colour scale
      mp4: /media/nova/solution/0/media/mp4.mp4
      webm: /media/nova/solution/0/media/webm.webm
  - heading: Making the system usable by AI-assisted coding workflows
    body: >-
      I structured the design system into modular Markdown files, separating
      components, design tokens, rules, screens, and references. Files like
      product.md and data.md provided additional context, giving Cursor/Claude a
      structured source of truth to reference when generating and modifying UI
      directly in code.
    media:
      image: ../../assets/case-studies/nova/solution/1/media/image.png
      alt: >-
        Code editor with the design system as Markdown files, open on the AI
        insight card's component spec
      mp4: /media/nova/solution/1/media/mp4.mp4
      webm: /media/nova/solution/1/media/webm.webm
  - heading: Connecting design decisions to implementation
    body: >-
      I exported design tokens from Figma, versioned them through GitHub, and
      structured the outputs for platform use. This helped keep design and
      engineering aligned across environments.
    media:
      image: ../../assets/case-studies/nova/solution/2/media/image.png
      alt: >-
        The Nova design system file in Figma, open on the Buttons page with
        every size and state
      mp4: /media/nova/solution/2/media/mp4.mp4
      webm: /media/nova/solution/2/media/webm.webm
