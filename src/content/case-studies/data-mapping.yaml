outcome:
  heading: A mapping workflow built around user control
  intro: >-
    The redesigned experience shifts configuration from raw transformation
    syntax to structured rules, making mapping logic more visible within the
    workflow.
  cards:
    - title: Independent configuration
      body: A visual interface for managing mappings without directly editing JSLT.
    - title: Inspectable logic
      body: Transformation conditions and results presented in a structured format.
    - title: Less engineering dependency
      body: >-
        A more understandable workflow reduced the need for repeated technical
        intervention.
reflection:
  heading: Simplifying doesn't mean hiding complexity
  body: >-
    The challenge was deciding which parts of the underlying logic users needed
    to see and control. Further validation would help establish how well the new
    interaction model supports increasingly complex mapping scenarios.
