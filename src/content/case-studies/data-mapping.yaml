overview:
  heading: A technical workflow was blocking business users
  intro: >-
    The existing mapping experience relied on JSLT, making transformations
    difficult for non-technical users to understand and configure.
  challengeLabel: The challenge
  challenge:
    - Mapping configurations often required technical support.
    - Errors could disrupt integrations and delay deployment.
    - Transformation logic was difficult to interpret.
  insightLabel: Key insight
  insight: >-
    The opportunity was to make transformation logic accessible through the
    interface while preserving the control needed for complex configurations.
solution:
  - heading: Reframing how users configure transformations
    body: >-
      I redesigned the workflow around structured mapping rules, translating a
      code-centric process into a configurable interface built around how users
      inspect and manage transformations.
    media:
      image: ../../assets/case-studies/data-mapping/solution/0/media/image.png
      alt: >-
        Smart mapping for a purchase order as a table: each target field with
        its type, an empty source column, and every row marked Unmapped
      mp4: /media/data-mapping/solution/0/media/mp4.mp4
      webm: /media/data-mapping/solution/0/media/webm.webm
  - heading: Turning transformation logic into configurable rules
    body: >-
      I replaced direct JSLT editing with structured conditions and results,
      making the logic behind each mapping easier to inspect and configure.
    media:
      image: ../../assets/case-studies/data-mapping/solution/1/media/image.png
      alt: >-
        The same table with Contract connected as a source: most fields now
        mapped from contract fields, a few still unmapped, and the pointer on
        Save
      mp4: /media/data-mapping/solution/1/media/mp4.mp4
      webm: /media/data-mapping/solution/1/media/webm.webm
