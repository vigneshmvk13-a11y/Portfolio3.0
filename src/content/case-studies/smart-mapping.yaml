outcome:
  heading: A workflow built around how users think
  intro: >-
    The redesigned experience made data mapping easier to understand, configure,
    and review.
  cards:
    - title: Independent configuration
      body: Business users could work with mappings without understanding JSLT.
    - title: Clearer transformations
      body: Source, rules, and destination relationships were easier to follow.
    - title: Less engineering dependency
      body: >-
        A more understandable workflow reduced the need for repeated technical
        intervention.
reflection:
  heading: Simplifying doesn't mean hiding complexity
  body: >-
    The goal wasn't to remove complexity. It was to decide what users needed to
    understand and what the system could handle for them.


    Next, I would explore mapping visualizations earlier and improve navigation
    as mappings grow more complex.
