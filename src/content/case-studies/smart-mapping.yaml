overview:
  heading: A technical workflow was blocking business users
  intro: >-
    The existing mapping experience relied on JSLT, making transformations
    difficult for non-technical users to understand and configure.
  challengeLabel: The challenge
  challenge:
    - Technical support was often needed to create mappings.
    - Mapping errors could break integrations and delay deployment.
    - Users struggled to understand transformation logic.
  insightLabel: The key insight
  insight: >-
    Users didn't need a more sophisticated mapping tool. They needed a clearer
    way to understand what the transformation was doing.
solution:
  - heading: Choosing clarity over complexity
    body: >-
      The visual mapping canvas became difficult to use at scale. I replaced it
      with a structured table that made mappings easier to scan and navigate.
    media:
      image: ../../assets/case-studies/smart-mapping/solution/0/media/image.png
      alt: >-
        Smart mapping for a purchase order as a table: each target field with
        its type, an empty source column, and every row marked Unmapped
      mp4: /media/smart-mapping/solution/0/media/mp4.mp4
      webm: /media/smart-mapping/solution/0/media/webm.webm
  - heading: Replacing code with understandable rules
    body: >-
      Instead of asking users to work with JSLT, I introduced a rule builder
      that translated complex transformation logic into simpler interactions.
    media:
      image: ../../assets/case-studies/smart-mapping/solution/1/media/image.png
      alt: >-
        The same table with Contract connected as a source: most fields now
        mapped from contract fields, a few still unmapped, and the pointer on
        Save
      mp4: /media/smart-mapping/solution/1/media/mp4.mp4
      webm: /media/smart-mapping/solution/1/media/webm.webm
